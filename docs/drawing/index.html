<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f2">
  <title>Whiteboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Whiteboard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Whiteboard</span>
      </div>
      <div class="history-actions" aria-label="履歴とキャンバスの操作">
        <button class="icon-button" id="undo" type="button" aria-label="元に戻す" title="元に戻す (Ctrl/⌘ + Z)" disabled>
          <span aria-hidden="true">↶</span><span class="button-label">Undo</span>
        </button>
        <button class="icon-button" id="redo" type="button" aria-label="やり直す" title="やり直す (Ctrl/⌘ + Shift + Z)" disabled>
          <span aria-hidden="true">↷</span><span class="button-label">Redo</span>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="clear-button" id="clear" type="button">全消去</button>
      </div>
    </header>

    <section class="workspace" aria-label="描画エリア">
      <div class="toolbar" role="toolbar" aria-label="描画ツール">
        <div class="tool-group" aria-label="ツール">
          <button class="tool active" type="button" data-tool="pointer" aria-label="ポインター" title="ポインター (V)" aria-pressed="true"><span class="tool-icon">↖</span><span>ポインター</span></button>
          <button class="tool" type="button" data-tool="pencil" aria-label="鉛筆" title="鉛筆 (P)" aria-pressed="false"><span class="tool-icon">✎</span><span>鉛筆</span></button>
          <button class="tool" type="button" data-tool="eraser" aria-label="消しゴム" title="消しゴム (E)" aria-pressed="false"><span class="tool-icon">◇</span><span>消しゴム</span></button>
          <button class="tool" type="button" data-tool="rect" aria-label="四角" title="四角 (R)" aria-pressed="false"><span class="shape-icon square"></span><span>四角</span></button>
          <button class="tool" type="button" data-tool="arrow" aria-label="矢印" title="矢印 (A)" aria-pressed="false"><span class="tool-icon">↗</span><span>矢印</span></button>
          <button class="tool" type="button" data-tool="text" aria-label="テキスト" title="テキスト (T)" aria-pressed="false"><span class="tool-icon text-icon">T</span><span>テキスト</span></button>
        </div>
        <div class="toolbar-divider" aria-hidden="true"></div>
        <fieldset class="width-group">
          <legend>線の太さ</legend>
          <button type="button" class="width-button active" data-width="2" aria-label="細" title="細" aria-pressed="true"><span class="line line-thin"></span><span>細</span></button>
          <button type="button" class="width-button" data-width="5" aria-label="中" title="中" aria-pressed="false"><span class="line line-medium"></span><span>中</span></button>
          <button type="button" class="width-button" data-width="9" aria-label="太" title="太" aria-pressed="false"><span class="line line-thick"></span><span>太</span></button>
        </fieldset>
      </div>

      <div class="canvas-shell" id="canvasShell">
        <canvas id="board" aria-label="白い描画キャンバス"></canvas>
        <textarea id="textInput" class="text-input" aria-label="テキストを入力" rows="1" placeholder="テキストを入力"></textarea>
        <div class="empty-hint" id="emptyHint" aria-hidden="true">
          <span>✎</span>
          <p>ツールを選んで描き始めましょう</p>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite">ポインターを選択中</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
