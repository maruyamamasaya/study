<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="インフラエンジニアリングの学習ノート">
  <title>Study Notes</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script>
    (function () {
      var theme = window.localStorage.getItem('study-notes:theme');
      if (/^[1-5]$/.test(theme || '')) {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css?v=20260819-mobile-history">
  <style>
    [data-auth-pending] #app { display: none; }
    .auth-screen {
      align-items: center;
      background: #0d1117;
      color: #d8dee9;
      display: flex;
      inset: 0;
      justify-content: center;
      padding: 1.5rem;
      position: fixed;
      z-index: 10000;
    }
    .auth-card { max-width: 360px; width: 100%; }
    .auth-card h1 { color: #f0f3f6; font-size: 1.5rem; margin: 0 0 .5rem; }
    .auth-card p { color: #8b98a7; margin: 0 0 1.5rem; }
    .auth-card label { display: block; font-weight: 600; margin-bottom: .5rem; }
    .auth-card input {
      background: #151b23;
      border: 1px solid #2b3440;
      border-radius: 6px;
      color: #f0f3f6;
      font: inherit;
      padding: .75rem;
      width: 100%;
    }
    .auth-card button {
      background: #65f59a;
      border: 0;
      border-radius: 6px;
      color: #07110b;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      margin-top: 1rem;
      padding: .75rem;
      width: 100%;
    }
    .auth-error { color: #ff8b8b !important; margin: .75rem 0 0 !important; min-height: 1.5em; }
  </style>
</head>
<body data-auth-pending>
  <main class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
    <form class="auth-card" id="auth-form">
      <h1 id="auth-title">Study Notes</h1>
      <p>閲覧するにはパスワードを入力してください。</p>
      <label for="auth-password">パスワード</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">開く</button>
      <p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <div id="app">読み込み中...</div>

  <script src="password-gate.js"></script>
  <script>
    window.$docsify = {
      homepage: '📚 Study Notes Hub.md',
      loadSidebar: false,
      maxLevel: 4,
      subMaxLevel: 3,
      name: 'Study Notes',
      auto2top: true,
      markdown: {
        breaks: true
      }
    };
  </script>
  <script src="unique-heading-ids.js?v=20260819-toc-labels"></script>
  <script src="obsidian-wikilinks.js"></script>
  <script src="reader-tools.js?v=20260819-mobile-history"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
