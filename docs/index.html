<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="インフラエンジニアリングの学習ノート">
  <title>Study Notes</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script>
    (function () {
      var theme = window.localStorage.getItem('study-notes:theme');
      if (/^[1-5]$/.test(theme || '')) {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css?v=20260807-themes">
</head>
<body>
  <div id="app">読み込み中...</div>

  <script>
    window.$docsify = {
      homepage: '📚 Study Notes Hub.md',
      loadSidebar: false,
      maxLevel: 4,
      subMaxLevel: 3,
      name: 'Study Notes',
      auto2top: true,
      markdown: {
        breaks: true
      }
    };
  </script>
  <script src="obsidian-wikilinks.js"></script>
  <script src="reader-tools.js?v=20260807-themes"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
