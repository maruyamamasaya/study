<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ファイルをブラウザ内だけで表示できるCSVビューアー">
  <title>CSVビューアー</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div>
        <p class="eyebrow">LOCAL CSV VIEWER</p>
        <h1>CSVビューアー</h1>
      </div>
      <p class="privacy-notice"><span aria-hidden="true">&#128274;</span> このCSVは外部サーバーへ送信されません。すべてブラウザ内で処理されます。</p>
    </header>

    <section id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="CSVファイルを選択、またはドロップ">
      <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
      <div class="file-icon" aria-hidden="true">CSV</div>
      <h2>CSVファイルをここにドロップ</h2>
      <p>または</p>
      <button id="selectButton" class="primary-button" type="button">ファイルを選択</button>
      <p class="drop-note">UTF-8 / Shift_JIS ・ファイルは端末内だけで処理されます</p>
    </section>

    <p id="errorMessage" class="error-message" role="alert" hidden></p>

    <section id="viewer" class="viewer" aria-live="polite" hidden>
      <div class="toolbar">
        <div class="file-summary">
          <div class="loaded-icon" aria-hidden="true">CSV</div>
          <div><strong id="fileName"></strong><span id="encodingLabel"></span></div>
        </div>
        <div class="statistics" aria-label="CSVの概要">
          <span><strong id="rowCount">0</strong> 行</span>
          <span><strong id="columnCount">0</strong> 列</span>
        </div>
        <button id="changeFileButton" class="secondary-button" type="button">別のCSVを開く</button>
      </div>

      <label class="search-box" for="searchInput">
        <span aria-hidden="true">&#128269;</span>
        <input id="searchInput" type="search" placeholder="キーワードで全列を検索" autocomplete="off">
        <span id="filteredCount" class="filtered-count"></span>
      </label>

      <div class="table-shell" tabindex="0" aria-label="CSVデータ（横方向にスクロールできます）">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <p id="emptyResult" class="empty-result" hidden>該当する行がありません。</p>
      </div>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
